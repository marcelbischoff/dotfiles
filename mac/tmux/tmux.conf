unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix

# mouse support
set -g mouse on

#### COLOUR (Solarized 256)

# default statusbar colors
set-option -g status-style fg=blue,bg=black #yellow and base02

# for nvim
set-option -sg escape-time 10
set-option -g focus-events on
set-option -sa terminal-overrides ',XXX:RGB'

# default window title colors
set-window-option -g window-status-style fg=colour244,bg=default #base0 and default
#set-window-option -g window-status-style dim

# active window title colors
set-window-option -g window-status-current-style fg=colour166,bg=default #orange and default
#set-window-option -g window-status-current-style bright

# pane border
set-option -g pane-border-style fg=colour235 #base02
set-option -g pane-active-border-style fg=colour240 #base01

# message text
set-option -g message-style fg=red,bg=colour235 #orange and base02

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green

# bell
set-window-option -g window-status-bell-style fg=colour235,bg=colour160 #base02, re

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'catppuccin/tmux'
# ...alongside
set -g @plugin 'tmux-plugins/tpm'

set -g @catppuccin_flavour 'macchiato' # or frappe, macchiato, mocha

#set -g @catppuccin_window_tabs_enabled on # or off to disable window_tabs
#set -g @catppuccin_left_separator "█"
#set -g @catppuccin_right_separator "█"


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'

# as asked by nvim
set-option -ga terminal-overrides ',XXX:Tc'
set -g default-terminal "xterm-256color"

run '~/.tmux/plugins/tpm/tpm'

# >>> lfmdictate >>>
bind-key D display-popup -E -w 70% -h 60% "uv run --project /Users/marcel/code/misc/lfmdictate lfmdictate popup"
bind-key T run-shell -b "uv run --project /Users/marcel/code/misc/lfmdictate lfmdictate ctl toggle"
bind-key S run-shell -b "uv run --project /Users/marcel/code/misc/lfmdictate lfmdictate ctl send"
bind-key A run-shell -b "uv run --project /Users/marcel/code/misc/lfmdictate lfmdictate ctl dictate"
set -g mouse on
bind -n MouseDown1Status switch-client -t =
bind -n DoubleClick1Status run-shell -b "uv run --project /Users/marcel/code/misc/lfmdictate lfmdictate ctl toggle"
bind -n MouseDown2Status run-shell -b "uv run --project /Users/marcel/code/misc/lfmdictate lfmdictate ctl toggle"
bind -n MouseDown1StatusRight run-shell -b "uv run --project /Users/marcel/code/misc/lfmdictate lfmdictate ctl send"
bind -n DoubleClick1StatusRight run-shell -b "uv run --project /Users/marcel/code/misc/lfmdictate lfmdictate ctl dictate"
bind-key V display-popup -w 80% -h 60% "tail -n 40 /Users/marcel/.cache/lfmdictate/transcript.log 2>/dev/null || echo 'no transcripts yet'"
set -ag status-right " #(cat /Users/marcel/.cache/lfmdictate/status 2>/dev/null)"
